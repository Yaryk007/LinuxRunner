name: Build IPA

# LinuxRunner fork: JIT-capable + Metal GPU (virgl on ANGLE/Metal) IPA,
# Native/Custom resolution and the mobile shells.
# ANGLE is the slow part (first run: checkout + build, roughly an hour); its
# outputs are cached by the pinned revisions, so later runs skip it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  VIRGL_REV: e0a1caf3b147bb26dfe524dbb85ded1177e7e49e
  EPOXY_REV: d1f952c4565c389d82fd1657153e84e050f35b27
  ANGLE_REV: feebf60fe088ccec3a26a7419d6ac68edf542c7a
  DEPOT_TOOLS_REV: a20039648c0de69d8156906b18052bd47e9bf230

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pinned submodules
        run: git submodule update --init --recursive --checkout --depth 1 -- deps/libapps deps/libarchive deps/glslang deps/spirv-cross

      - name: Tools
        run: |
          brew install meson ninja lld cmake pkgconf
          # virglrenderer's gallium meson.build needs python3 + PyYAML
          python3 -m pip install --user --break-system-packages pyyaml || python3 -m pip install --break-system-packages pyyaml
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          df -h "$GITHUB_WORKSPACE"

      - name: Restore ANGLE (cached by revision)
        id: angle
        uses: actions/cache/restore@v4
        with:
          path: |
            build/gpu/iphoneos/lib/libangle.a
            build/gpu/iphoneos/include/angle
          key: angle-metal-iphoneos-${{ env.ANGLE_REV }}-v2

      - name: Fetch GPU sources (pinned)
        run: |
          set -euo pipefail
          export GPU_DEPS="$RUNNER_TEMP/gpu-deps"; echo "GPU_DEPS=$GPU_DEPS" >> "$GITHUB_ENV"
          mkdir -p "$GPU_DEPS"
          pinned() {  # dir url sha: shallow fetch of exactly one commit
            git init -q "$GPU_DEPS/$1"; git -C "$GPU_DEPS/$1" remote add origin "$2"
            git -C "$GPU_DEPS/$1" fetch -q --depth 1 origin "$3"; git -C "$GPU_DEPS/$1" checkout -q --detach FETCH_HEAD
          }
          pinned virglrenderer https://gitlab.freedesktop.org/virgl/virglrenderer.git "$VIRGL_REV"
          pinned libepoxy https://github.com/anholt/libepoxy.git "$EPOXY_REV"
          [ "${{ steps.angle.outputs.cache-hit }}" != true ] || exit 0
          pinned depot_tools https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_REV"
          # Initialize depot_tools' bundled Python/CIPD once (its wrappers need it).
          (cd "$GPU_DEPS/depot_tools" && DEPOT_TOOLS_UPDATE=0 ./ensure_bootstrap)
          pinned angle https://chromium.googlesource.com/angle/angle.git "$ANGLE_REV"
          export PATH="$GPU_DEPS/depot_tools:$PATH" DEPOT_TOOLS_UPDATE=0
          cd "$GPU_DEPS/angle"
          # Same as ANGLE's scripts/bootstrap.py (in-place checkout), plus iOS deps.
          cat > .gclient <<'GCLIENT'
          solutions = [{
            "name": ".",
            "url": "https://chromium.googlesource.com/angle/angle.git",
            "deps_file": "DEPS",
            "managed": False,
            "custom_vars": {},
          }]
          target_os = ["ios", "mac"]
          GCLIENT
          gclient sync --no-history --shallow -j 8

      - name: Build ANGLE (Metal)
        if: steps.angle.outputs.cache-hit != 'true'
        env:
          ANGLE_ONLY: "1"
          DEPOT_TOOLS_UPDATE: "0"
        run: scripts/build-gpu-deps.sh iphoneos

      - name: Save ANGLE
        if: steps.angle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/gpu/iphoneos/lib/libangle.a
            build/gpu/iphoneos/include/angle
          key: angle-metal-iphoneos-${{ env.ANGLE_REV }}-v2

      - name: Build libepoxy + virglrenderer
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          scripts/build-gpu-deps.sh iphoneos
          rm -rf build/gpu/iphoneos/work

      - name: Build (JIT + Metal GPU, unsigned)
        env:
          LINUXRUNNER_JIT: "YES"
          LINUXRUNNER_VIRGL: "YES"
          BUNDLE_ID: com.yaryk007.linuxrunner
          ARTIFACT_NAME: LinuxRunner-JIT
          RELEASE_DIR: ${{ github.workspace }}/build/releases
        run: scripts/build-ipa.sh --unsigned

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinuxRunner-JIT-ipa
          path: |
            build/releases/LinuxRunner-JIT.ipa
            build/releases/LinuxRunner-JIT.ipa.sha256
            build/releases/SIGNING-STATUS.txt
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/releases/archive.log
            build/gpu/iphoneos/work/**/meson-logs/meson-log.txt
          if-no-files-found: ignore
